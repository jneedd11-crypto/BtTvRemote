name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Archive
      run: |
        echo "Searching for uploaded zip file..."
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        fi
        
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted_project
        else
          echo "Error: No zip file found in the repository!"
          exit 1
        fi

    - name: Find Project Directory
      id: find-dir
      run: |
        PROJ_DIR=$(find extracted_project -name "build.gradle.kts" -maxdepth 4 -exec dirname {} \; | head -n 1)
        if [ -z "$PROJ_DIR" ]; then
          PROJ_DIR="extracted_project"
        fi
        echo "project_path=$PROJ_DIR" >> $GITHUB_OUTPUT
        echo "Project directory is: $PROJ_DIR"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Wrapper and Build APK
      working-directory: ${{ steps.find-dir.outputs.project_path }}
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Gradle wrapper not found, generating one..."
          gradle wrapper --gradle-version 8.4
        fi
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bt-remote-debug
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
